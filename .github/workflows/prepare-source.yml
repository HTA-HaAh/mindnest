name: Prepare MINDNEST source
on:
  push:
    paths:
      - "MINDNEST_V1_MVP.zip.b64"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  extract-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Extract Next.js project into repository root
        run: |
          if [ ! -f MINDNEST_V1_MVP.zip.b64 ]; then
            echo "No source archive found; nothing to extract."
            exit 0
          fi
          base64 -d MINDNEST_V1_MVP.zip.b64 > /tmp/mindnest.zip
          mkdir -p /tmp/mindnest-source
          unzip -q /tmp/mindnest.zip -d /tmp/mindnest-source
          cp -a /tmp/mindnest-source/mindnest-v1/. .
          rm -f MINDNEST_V1_MVP.zip.b64
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Add MINDNEST V1.0 application source"
            git push
          fi
